app = "said-agent-test"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 18789
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "performance-1x"
  memory = "2048mb"

[mounts]
  source = "agent_data"
  destination = "/agent/data"
